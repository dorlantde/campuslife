worker_processes auto;
pid /tmp/nginx.pid;
# Native request error messages include the full query string; retain sanitized access logs instead.
error_log /dev/null crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format campuslife escape=json '{"request_id":"$request_id","trace_id":"$upstream_http_x_trace_id","method":"$request_method","path":"$uri","status":$status,"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';
    access_log /dev/stdout campuslife;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server {
        listen 8080;
        client_max_body_size 22m;
        client_body_timeout 60s;
        add_header X-Edge-Request-Id $request_id always;
        error_page 413 /_edge/413;
        error_page 502 /_edge/502;
        error_page 504 /_edge/504;
        location = /_edge/413 { internal; default_type application/json; return 413 '{"code":"EDGE_PAYLOAD_TOO_LARGE","message":"Request exceeds gateway limit","data":null,"requestId":"$request_id"}'; }
        location = /_edge/502 { internal; default_type application/json; return 502 '{"code":"EDGE_BAD_GATEWAY","message":"Application is unavailable","data":null,"requestId":"$request_id"}'; }
        location = /_edge/504 { internal; default_type application/json; return 504 '{"code":"EDGE_GATEWAY_TIMEOUT","message":"Application response timed out","data":null,"requestId":"$request_id"}'; }
        location ~ ^/(api/v1/|v3/api-docs(?:/|$)|swagger-ui(?:/|\.html$)) {
            set $campuslife_backend app:8080;
            proxy_pass http://$campuslife_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Trace-Id "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
        location / { default_type application/json; return 404 '{"code":"EDGE_NOT_FOUND","message":"Unknown gateway path","data":null,"requestId":"$request_id"}'; }
    }
}
