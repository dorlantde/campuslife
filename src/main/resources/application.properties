spring.application.name=campuslife
spring.profiles.default=mysql
spring.sql.init.mode=never
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.resources.add-mappings=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
logging.pattern.level=%5p [traceId=%X{traceId:-}]
# Local interactive documentation; deployments can disable both with API_DOCS_ENABLED=false.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${springdoc.api-docs.enabled}
springdoc.api-docs.version=OPENAPI_3_0
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=com.campuslife.auth,com.campuslife.system
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.display-request-duration=true
