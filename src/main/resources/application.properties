spring.application.name=campuslife
# Operations HTTP is opt-in and independent from business sessions/JWT.
campuslife.management.enabled=${MANAGEMENT_ENABLED:false}
campuslife.management.password=${MANAGEMENT_PASSWORD:}
management.server.port=${MANAGEMENT_PORT:-1}
management.server.address=127.0.0.1
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
spring.jmx.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.defaults.enabled=false
management.health.db.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.validate-group-membership=false
management.metrics.use-global-registry=false
spring.config.import=optional:file:./.local/rating-cache.properties,optional:file:./.local/messaging.properties,optional:file:./.local/coupon-redis.properties
# Redis is an optional cache with an explicitly conditional connection factory.
spring.autoconfigure.exclude=org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration,org.springframework.boot.data.redis.autoconfigure.DataRedisRepositoriesAutoConfiguration,org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
campuslife.rating-cache.enabled=${RATING_CACHE_ENABLED:false}
campuslife.rating-cache.namespace=${RATING_CACHE_NAMESPACE:}
campuslife.rating-cache.host=${RATING_CACHE_HOST:127.0.0.1}
campuslife.rating-cache.port=${RATING_CACHE_PORT:6379}
campuslife.rating-cache.username=${RATING_CACHE_USERNAME:}
campuslife.rating-cache.password=${RATING_CACHE_PASSWORD:}
spring.profiles.default=mysql
spring.sql.init.mode=never
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force-response=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.web.resources.add-mappings=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never
logging.pattern.level=%5p [traceId=%X{traceId:-}]
# Local interactive documentation; deployments can disable both with API_DOCS_ENABLED=false.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${springdoc.api-docs.enabled}
springdoc.api-docs.version=OPENAPI_3_0
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=com.campuslife.auth,com.campuslife.system,com.campuslife.merchant,com.campuslife.admin.controller,com.campuslife.order.controller,com.campuslife.file.controller,com.campuslife.coupon.controller,com.campuslife.messaging.controller
springdoc.override-with-generic-response=false
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.validator-url=none
springdoc.swagger-ui.display-request-duration=true
campuslife.mock-payment.enabled=${MOCK_PAYMENT_ENABLED:false}
campuslife.files.root=${FILE_STORAGE_ROOT:./.local/files}
campuslife.files.cleanup-enabled=${FILE_CLEANUP_ENABLED:true}
campuslife.files.upload-target=${FILE_UPLOAD_TARGET:LOCAL}
campuslife.files.s3.enabled=${FILE_S3_ENABLED:false}
campuslife.files.s3.endpoint=${FILE_S3_ENDPOINT:}
campuslife.files.s3.region=${FILE_S3_REGION:us-east-1}
campuslife.files.s3.bucket=${FILE_S3_BUCKET:}
campuslife.files.s3.namespace=${FILE_S3_NAMESPACE:}
campuslife.files.s3.access-key=${FILE_S3_ACCESS_KEY:}
campuslife.files.s3.secret-key=${FILE_S3_SECRET_KEY:}

# Outbox facts are always written; only network transport is optional.
campuslife.messaging.enabled=${MESSAGING_ENABLED:false}
campuslife.messaging.host=${MESSAGING_HOST:127.0.0.1}
campuslife.messaging.port=${MESSAGING_PORT:5672}
campuslife.messaging.username=${MESSAGING_USERNAME:}
campuslife.messaging.password=${MESSAGING_PASSWORD:}
campuslife.messaging.vhost=${MESSAGING_VHOST:}
campuslife.messaging.scheduling-enabled=${MESSAGING_SCHEDULING_ENABLED:true}
campuslife.messaging.publisher-batch-size=${MESSAGING_PUBLISHER_BATCH_SIZE:32}
campuslife.messaging.consumer-enabled=${MESSAGING_CONSUMER_ENABLED:true}

# Activities remain SYNC by default; explicit local maintenance is required for ASYNC.
campuslife.coupon.expiry-enabled=${COUPON_EXPIRY_ENABLED:true}

# Dedicated reservation dataset; never shares the expendable rating-cache Redis.
campuslife.coupon-redis.enabled=${COUPON_REDIS_ENABLED:false}
campuslife.coupon-redis.namespace=${COUPON_REDIS_NAMESPACE:}
campuslife.coupon-redis.host=${COUPON_REDIS_HOST:127.0.0.1}
campuslife.coupon-redis.port=${COUPON_REDIS_PORT:6379}
campuslife.coupon-redis.username=${COUPON_REDIS_USERNAME:}
campuslife.coupon-redis.password=${COUPON_REDIS_PASSWORD:}
campuslife.coupon-redis.scheduling-enabled=${COUPON_REDIS_SCHEDULING_ENABLED:true}
